[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisdo"
version = "0.1.0"
description = "AI Agent 驱动的 GeoScene / ArcGIS 安全工作台：检查、提取、打包、出图、校验"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "braze-taffo" }]
keywords = ["GeoScene", "ArcGIS", "ArcPy", "GIS", "cartography", "agent", "LLM"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PySide6>=6.6",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]
dev = ["pytest>=7", "pytest-qt>=4"]

[project.urls]
Homepage = "https://github.com/braze-taffo/gisdo"
Repository = "https://github.com/braze-taffo/gisdo"

[project.scripts]
gisdo = "gisdo.cli:main"
gisdo-gui = "gisdo.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gisdo.engine" = ["scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
