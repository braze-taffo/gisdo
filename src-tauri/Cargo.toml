[package]
name = "gisdo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "gisdo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gisdo"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
directories.workspace = true
gisdo-domain = { path = "../crates/domain" }
gisdo-llm = { path = "../crates/llm" }
gisdo-orchestrator = { path = "../crates/orchestrator" }
gisdo-safety = { path = "../crates/safety" }
gisdo-storage = { path = "../crates/storage" }
gisdo-worker-client = { path = "../crates/worker-client" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
